<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Austin Weekly Intelligence Report</title>
<style>
:root{color-scheme:light;--bg:#f3f5f7;--panel:#fff;--ink:#202124;--line:#d9dee5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 4px #0000000d}
.brand{font-size:14px;font-weight:700;margin-right:auto}button,select{min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}#status{width:100%;font-size:12px;color:#5f6368}
#error{display:none;margin:16px auto;max-width:760px;padding:14px;background:#fff4f2;color:#8a1c0d;border:1px solid #f2c5bd;border-radius:8px;line-height:1.5}
#viewer{padding:16px 10px 28px}.page{margin:0 auto 16px;background:#fff;box-shadow:0 2px 12px #00000018;overflow:hidden}canvas{display:block;width:100%;height:auto}
@media(max-width:520px){.toolbar{gap:6px;padding:8px}.brand{width:100%}#viewer{padding:10px 4px 20px}}
</style>
</head>
<body>
<header class="toolbar">
<div class="brand">Austin Weekly Intelligence Report</div>
<button id="fitWidth" type="button">Fit to Width</button><button id="fitPage" type="button">Fit Page</button>
<button id="zoomOut" type="button" aria-label="Zoom out">−</button>
<select id="zoomSelect" aria-label="Zoom level">
<option value="page-width" selected>Fit to Width</option><option value="page-fit">Fit Page</option>
<option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option>
</select>
<button id="zoomIn" type="button" aria-label="Zoom in">+</button>
<button id="prevPage" type="button" disabled>Previous</button><span id="pageInfo">Page — / —</span><button id="nextPage" type="button" disabled>Next</button>
<div id="status">Loading report…</div>
</header>
<div id="error" role="alert"></div><main id="viewer"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
// Pass a test PDF URL using ?file=URL_ENCODED_PDF_URL.
// Private Google Drive PDFs may fail due to authentication/CORS. Do not make confidential reports public.
const PDF_URL = new URLSearchParams(location.search).get("file") || "";
const pdfjsLib = window["pdfjs-dist/build/pdf"];
const viewer = document.getElementById("viewer"), statusEl = document.getElementById("status");
const errorEl = document.getElementById("error"), pageInfo = document.getElementById("pageInfo");
const zoomSelect = document.getElementById("zoomSelect"), prevButton = document.getElementById("prevPage"), nextButton = document.getElementById("nextPage");
let pdfDoc = null, currentPage = 1, zoomMode = "page-width", renderToken = 0;
if (pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function showError(message){errorEl.textContent=message;errorEl.style.display="block";statusEl.textContent="Unable to load PDF";viewer.replaceChildren();}
function getScale(page){
 const v=page.getViewport({scale:1}), w=Math.max(280,viewer.clientWidth-20), h=Math.max(300,innerHeight-150);
 if(zoomMode==="page-width") return w/v.width;
 if(zoomMode==="page-fit") return Math.min(w/v.width,h/v.height);
 const n=Number(zoomMode); return Number.isFinite(n)&&n>0?n:1;
}
async function renderPage(pageNumber){
 if(!pdfDoc)return; const token=++renderToken; currentPage=Math.min(Math.max(1,pageNumber),pdfDoc.numPages);
 const page=await pdfDoc.getPage(currentPage); if(token!==renderToken)return;
 const scale=getScale(page), viewport=page.getViewport({scale}), outputScale=Math.min(devicePixelRatio||1,2);
 const wrapper=document.createElement("section"); wrapper.className="page"; wrapper.style.width=Math.floor(viewport.width)+"px";
 const canvas=document.createElement("canvas"), context=canvas.getContext("2d",{alpha:false});
 canvas.width=Math.floor(viewport.width*outputScale);canvas.height=Math.floor(viewport.height*outputScale);
 canvas.style.width=Math.floor(viewport.width)+"px";canvas.style.height=Math.floor(viewport.height)+"px";wrapper.appendChild(canvas);viewer.replaceChildren(wrapper);
 await page.render({canvasContext:context,viewport,transform:outputScale!==1?[outputScale,0,0,outputScale,0,0]:null}).promise;
 if(token!==renderToken)return;
 pageInfo.textContent="Page "+currentPage+" / "+pdfDoc.numPages;prevButton.disabled=currentPage<=1;nextButton.disabled=currentPage>=pdfDoc.numPages;
 statusEl.textContent=zoomMode==="page-width"?"Fit to Width":zoomMode==="page-fit"?"Fit Page":Math.round(Number(zoomMode)*100)+"%";
}
async function loadPdf(){
 if(!pdfjsLib){showError("PDF.js failed to load. Check your internet connection or CDN availability.");return;}
 if(!PDF_URL){showError("No PDF URL supplied. Add ?file=ENCODED_PDF_URL to this page using a test PDF that is accessible without signing in and permits CORS.");return;}
 try{statusEl.textContent="Loading PDF…";pdfDoc=await pdfjsLib.getDocument({url:PDF_URL,withCredentials:false}).promise;zoomMode="page-width";zoomSelect.value=zoomMode;await renderPage(1);statusEl.textContent=pdfDoc.numPages+" page(s) loaded";}
 catch(err){console.error("PDF.js load error:",err);showError("Could not load PDF. The URL must point to PDF data and allow cross-origin access (CORS). A private Google Drive PDF usually needs an authenticated integration. Do not make confidential reports public to bypass this.");}
}
document.getElementById("fitWidth").addEventListener("click",()=>{zoomMode="page-width";zoomSelect.value=zoomMode;renderPage(currentPage);});
document.getElementById("fitPage").addEventListener("click",()=>{zoomMode="page-fit";zoomSelect.value=zoomMode;renderPage(currentPage);});
document.getElementById("zoomOut").addEventListener("click",()=>{const n=zoomMode==="page-width"||zoomMode==="page-fit"?1:Number(zoomMode);zoomMode=String(Math.max(.5,n-.1));zoomSelect.value=zoomMode;renderPage(currentPage);});
document.getElementById("zoomIn").addEventListener("click",()=>{const n=zoomMode==="page-width"||zoomMode==="page-fit"?1:Number(zoomMode);zoomMode=String(Math.min(2.5,n+.1));zoomSelect.value=zoomMode;renderPage(currentPage);});
zoomSelect.addEventListener("change",()=>{zoomMode=zoomSelect.value;renderPage(currentPage);});
prevButton.addEventListener("click",()=>renderPage(currentPage-1));nextButton.addEventListener("click",()=>renderPage(currentPage+1));
window.addEventListener("resize",()=>{if(pdfDoc&&(zoomMode==="page-width"||zoomMode==="page-fit"))renderPage(currentPage);});
loadPdf();
</script>
</body>
</html>
